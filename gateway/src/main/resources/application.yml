spring:
  application:
    name: event-gateway
  datasource:
    url: jdbc:h2:file:./.data/event-gateway/gateway;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init.sql
  threads:
    virtual:
      enabled: true

server:
  port: 8080

account-service:
  base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      accountService:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      accountService:
        maxAttempts: 3
        waitDuration: 100ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptions:
          - java.io.IOException
          - org.springframework.web.client.HttpServerErrorException
  bulkhead:
    instances:
      accountService:
        maxConcurrentCalls: 20
        maxWaitDuration: 0

logging:
  config: classpath:logback-spring.xml
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:h2:file:./.data/event-gateway/gateway;AUTO_SERVER=TRUE;MODE=PostgreSQL
